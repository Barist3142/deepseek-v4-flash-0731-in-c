name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Wrong *output* is the most important class of bug here, the engine can produce
        fluent text from a wrong model. If tokens look off, say so even without a crash.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command line.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}
  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "e.g. Intel Core i5-1340P, 12 cores / 16 logical CPUs"
    validations: {required: true}
  - type: input
    id: mem
    attributes:
      label: RAM and storage
      placeholder: "e.g. 32 GB installed, 23.5 GiB visible to WSL2, NVMe/ext4"
  - type: textarea
    id: gates
    attributes:
      label: Output of `make test`
      render: shell
    validations: {required: true}
